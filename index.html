<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

        }
      ]
    }

    <style>
        :root {
            color-scheme: light;
            --page: #f5f5f7;
            --surface: #fff;
            --text: #1d1d1f;
            --muted: #626269;
            --hairline: rgba(29, 29, 31, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            background: var(--page);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        .container {
            width: min(100%, 33rem);
            padding: clamp(2rem, 7vw, 4rem) clamp(1rem, 4vw, 2rem);
            text-align: center;
        }

        .avatar {
            display: block;
            width: clamp(8.75rem, 28vw, 9.75rem);
            height: clamp(8.75rem, 28vw, 9.75rem);
            margin: 0 auto;
            border: 4px solid var(--surface);
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 1rem 2.5rem rgba(29, 29, 31, 0.12);
        }

        h1 {
            margin: 1.5rem 0 1rem;
            font-size: clamp(1.9rem, 5vw, 2.25rem);
            font-weight: 600;
            line-height: 1.08;
            letter-spacing: -0.04em;
        }

        .contacts {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }

        .contacts a {
            min-height: 2.75rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.65rem 0.9rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.72);
            color: #36363a;
            font-size: 0.95rem;
            font-weight: 500;
            line-height: 1;
            text-decoration: none;
            transition: background-color 0.2s, color 0.2s, transform 0.2s;
        }

        .contacts a:hover {
            background: var(--surface);
            color: #000;
            transform: translateY(-1px);
        }

        .contacts a:focus-visible,
        .hidden-nav a:focus-visible {
            outline: 2px solid #0066cc;
            outline-offset: 3px;
        }

        .contacts a .icon {
            width: 1.125rem;
            height: 1.125rem;
            display: block;
            flex: 0 0 auto;
        }

        .banner {
            width: min(100%, 22rem);
            min-height: 5rem;
            margin: 0 auto;
            padding: 1rem 1.125rem;
            display: grid;
            grid-template-columns: 3rem minmax(0, 1fr);
            align-items: center;
            gap: 1rem;
            border: 1px solid var(--hairline);
            border-radius: 12px;
            background: var(--surface);
            box-shadow: 0 0.75rem 2rem rgba(29, 29, 31, 0.06);
        }

        .banner-avatar {
            --logo-scale: 0.94;
            width: 3rem;
            height: 3rem;
            display: block;
            border-radius: 10px;
            object-fit: contain;
            opacity: 0;
            transform: scale(var(--logo-scale));
            transition: opacity 0.4s;
        }

        .banner-avatar[data-logo="google"] {
            --logo-scale: 1.15;
        }

        .banner-avatar[data-logo="containerd"] {
            --logo-scale: 1.32;
        }

        .banner-avatar.visible {
            opacity: 1;
        }

        .banner-text {
            min-width: 0;
            color: var(--muted);
            font-size: 1.05rem;
            font-weight: 500;
            line-height: 1.35;
            letter-spacing: -0.01em;
            text-align: left;
        }

        .hidden-nav {
            display: none;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--hairline);
        }

        .hidden-nav.visible {
            display: block;
        }

        .hidden-nav ul {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem 1.25rem;
            justify-content: center;
        }

        .hidden-nav a {
            display: inline-block;
            padding: 0.5rem 0;
            color: var(--muted);
            font-size: 0.9rem;
            text-decoration: none;
            transition: color 0.2s;
        }

        .hidden-nav a:hover {
            color: var(--text);
        }

        @media (max-width: 520px) {
            body {
                align-items: flex-start;
                padding: 1rem 0.75rem;
            }

            .container {
                padding: 2rem 0.5rem;
            }

            .contacts {
                gap: 0.5rem;
            }

            .contacts a {
                padding-inline: 0.8rem;
            }

            .banner {
                grid-template-columns: 2.75rem minmax(0, 1fr);
                gap: 0.875rem;
                padding: 0.875rem 1rem;
            }

            .banner-avatar {
                width: 2.75rem;
                height: 2.75rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .contacts a,
            .banner-avatar,
            .hidden-nav a {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="avatar" id="profileAvatar" src="assets/avatar.jpg" alt="Sergey Kanzhelev">
        <h1>Sergey Kanzhelev</h1>
        <div class="contacts">
            <a href="https://github.com/SergeyKanzhelev">
                <img class="icon" src="assets/github.svg" alt="" aria-hidden="true"> GitHub
            </a>
            <a href="https://www.linkedin.com/in/sergeykanzhelev/">
                <img class="icon" src="assets/linkedin.svg" alt="" aria-hidden="true"> LinkedIn
            </a>
        </div>
        <div class="banner">
            <img class="banner-avatar" id="bannerImg" src="" alt="">
            <span class="banner-text" id="bannerText"></span>
        </div>
        <nav class="hidden-nav" id="hiddenNav" aria-hidden="true">
            <ul>
                <li><a href="til/">TIL</a></li>
                <li><a href="notes/">Notes for Self</a></li>
                <li><a href="conferences/">Conferences</a></li>
                <li><a href="bio/">Bio</a></li>
            </ul>
        </nav>
    </div>

    <script type="module" src="assets/banner.js"></script>
    <script type="module" src="assets/navigation.js"></script>
</body>
</html>
