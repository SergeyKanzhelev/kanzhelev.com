<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sergey Kanzhelev</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #fafafa;
            color: #333;
        }

        .container {
            text-align: center;
            padding: 2rem;
        }

        .avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .contacts {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            margin-bottom: 3rem;
        }

        .contacts a {
            color: #555;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .contacts a:hover {
            color: #000;
        }

        .contacts a .icon {
            width: 20px;
            height: 20px;
            vertical-align: middle;
            margin-right: 4px;
        }

        .banner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            height: 50px;
        }

        .banner-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.4s;
        }

        .banner-avatar.visible {
            opacity: 1;
        }

        .banner-text {
            font-size: 1rem;
            color: #666;
            min-width: 200px;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="avatar" src="assets/avatar.jpg" alt="Sergey Kanzhelev">
        <h1>Sergey Kanzhelev</h1>
        <div class="contacts">
            <a href="https://github.com/SergeyKanzhelev">
                <img class="icon" src="assets/github.svg" alt="GitHub"> GitHub
            </a>
            <a href="https://www.linkedin.com/in/sergeykanzhelev/">
                <img class="icon" src="assets/linkedin.svg" alt="LinkedIn"> LinkedIn
            </a>
        </div>
        <div class="banner">
            <img class="banner-avatar" id="bannerImg" src="" alt="">
            <span class="banner-text" id="bannerText"></span>
        </div>
    </div>

    <script>
        let items = [];
        const bannerImg = document.getElementById('bannerImg');
        const bannerText = document.getElementById('bannerText');
        let current = 0;

        fetch('banner.json')
            .then(r => r.json())
            .then(data => { items = data; showNext(); });

        function typeText(text, callback) {
            let i = 0;
            bannerText.textContent = '';
            function type() {
                if (i < text.length) {
                    bannerText.textContent += text[i];
                    i++;
                    setTimeout(type, 60);
                } else if (callback) {
                    setTimeout(callback, 2000);
                }
            }
            type();
        }

        function showNext() {
            const item = items[current];
            bannerImg.src = item.avatar;
            bannerImg.alt = item.name;
            bannerImg.classList.remove('visible');

            // Small delay then show avatar
            setTimeout(() => {
                bannerImg.classList.add('visible');
                typeText(item.text, () => {
                    bannerImg.classList.remove('visible');
                    bannerText.textContent = '';
                    current = (current + 1) % items.length;
                    setTimeout(showNext, 500);
                });
            }, 300);
        }

    </script>
</body>
</html>
