<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conferences - Sergey Kanzhelev</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
            color: #333;
        }
        a { color: #555; }
        a:hover { color: #000; }
        h1 { margin-bottom: 1.5rem; }
        .talk {
            border-bottom: 1px solid #eee;
            padding: 1rem 0;
        }
        .talk:last-child { border-bottom: none; }
        .talk-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.3rem;
        }
        .talk-conference {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 0.3rem;
        }
        .talk-presenters {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 0.4rem;
        }
        .talk-links {
            display: flex;
            gap: 1rem;
            font-size: 0.85rem;
        }
        .talk-links a {
            color: #0066cc;
            text-decoration: none;
        }
        .talk-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <p><a href="../index.html"><img src="../assets/avatar.jpg" alt="Home" style="width:40px;height:40px;border-radius:50%;vertical-align:middle;"></a></p>
    <h1>Conferences</h1>
    <div id="talks"></div>

    <script>
        fetch('data.json')
            .then(r => r.json())
            .then(talks => {
                talks.sort((a, b) => b.date.localeCompare(a.date));
                const container = document.getElementById('talks');
                talks.forEach(talk => {
                    const div = document.createElement('div');
                    div.className = 'talk';

                    let links = [];
                    if (talk.youtubeUrl) links.push(`<a href="${talk.youtubeUrl}">YouTube</a>`);
                    if (talk.presentationUrl) links.push(`<a href="${talk.presentationUrl}">Slides</a>`);
                    if (talk.agendaDocUrl) links.push(`<a href="${talk.agendaDocUrl}">Agenda</a>`);
                    if (talk.presentationDocUrl) links.push(`<a href="${talk.presentationDocUrl}">Presentation Doc</a>`);

                    const conferenceLink = talk.conferenceUrl
                        ? `<a href="${talk.conferenceUrl}">${talk.conference}</a>`
                        : talk.conference;

                    div.innerHTML = `
                        <div class="talk-title">${talk.title}</div>
                        <div class="talk-conference">${talk.date} &middot; ${conferenceLink}</div>
                        <div class="talk-presenters">${talk.presenters.join(', ')}</div>
                        ${links.length ? `<div class="talk-links">${links.join('')}</div>` : ''}
                    `;
                    container.appendChild(div);
                });
            });
    </script>
</body>
</html>
