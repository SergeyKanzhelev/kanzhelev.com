<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIL - Sergey Kanzhelev</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 600px;
            margin: 2rem auto;
            padding: 0 1rem;
            color: #333;
        }
        a { color: #555; }
        a:hover { color: #000; }
        h1 { margin-bottom: 1.5rem; }
        .post-list { list-style: none; padding: 0; }
        .post-list li {
            padding: 0.5rem 0;
            border-bottom: 1px solid #eee;
        }
        .post-list .date {
            font-size: 0.85rem;
            color: #888;
            margin-right: 0.5rem;
        }
    </style>
</head>
<body>
    <p><a href="../index.html"><img src="../assets/avatar.jpg" alt="Home" style="width:40px;height:40px;border-radius:50%;vertical-align:middle;"></a></p>
    <h1>TIL</h1>
    <ul class="post-list" id="posts"></ul>

    <script>
        fetch('posts.json')
            .then(r => r.json())
            .then(posts => {
                const list = document.getElementById('posts');
                posts.forEach(post => {
                    const li = document.createElement('li');
                    li.innerHTML = `<span class="date">${post.date}</span><a href="post.html?p=${post.slug}">${post.title}</a>`;
                    list.appendChild(li);
                });
            });
    </script>
</body>
</html>
