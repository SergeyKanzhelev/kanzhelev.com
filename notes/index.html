    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 700px;
            margin: 2rem auto;
            padding: 0 1rem;
            color: #333;
            line-height: 1.6;
        }
        a { color: #555; }
        a:hover { color: #000; }
        h1 { margin-bottom: 1rem; }
        .search-box {
            width: 100%;
            padding: 0.5rem;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 1.5rem;
        }
        .note {
            border-bottom: 1px solid #eee;
            padding: 1rem 0;
        }
        .note:last-child { border-bottom: none; }
        .note-title {
            font-weight: 600;
            margin-bottom: 0.3rem;
        }
        .note-preview {
            font-size: 0.9rem;
            color: #666;
        }
        .note.hidden { display: none; }
        pre { background: #f4f4f4; padding: 1rem; overflow-x: auto; border-radius: 4px; }
        code { background: #f4f4f4; padding: 0.2em 0.4em; border-radius: 3px; font-size: 0.9em; }
        pre code { background: none; padding: 0; }
    </style>
</head>
<body>
    <p><a href="../index.html"><img src="../assets/avatar.jpg" alt="Home" style="width:40px;height:40px;border-radius:50%;vertical-align:middle;"></a></p>
    <h1>Notes for Self</h1>
    <input type="text" class="search-box" id="search" placeholder="Search notes..." autofocus>
    <div id="notes"></div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        let notesData = [];

        fetch('notes.json')
            .then(r => r.json())
            .then(files => Promise.all(files.map(f =>
                fetch(`entries/${f}`).then(r => r.text()).then(content => ({ file: f, content }))
            )))
            .then(notes => {
                notesData = notes;
                render(notes);
            });

        function render(notes) {
            const container = document.getElementById('notes');
            container.innerHTML = '';
            notes.forEach(note => {
                const div = document.createElement('div');
                div.className = 'note';
                div.innerHTML = marked.parse(note.content);
                container.appendChild(div);
            });
        }

        document.getElementById('search').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase();
            const filtered = notesData.filter(n => n.content.toLowerCase().includes(q));
            render(filtered);
        });
    </script>
</body>
</html>
